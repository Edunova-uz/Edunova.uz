<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ro'yxatdan o'tish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161f; --chalk: #f6f7fb; --cobalt: #2b3dff; --sky: #d6dbff;
    --mint: #bff0d4; --muted: #5b6075; --error: #c62828; --ok: #1f8f5f;
    --display: "Unbounded", "Trebuchet MS", sans-serif;
    --body: "Manrope", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--cobalt); color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 24px; line-height: 1.6; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
  .box { background: var(--chalk); width: min(440px, 100%); border-radius: 22px; padding: 38px 34px; }
  h1 { font-family: var(--display); font-size: 1.6rem; letter-spacing: -0.01em; margin-bottom: 6px; }
  .sub { color: var(--muted); margin-bottom: 26px; }
  form { display: grid; gap: 18px; }
  label { font-weight: 700; font-size: .95rem; display: grid; gap: 6px; }
  .field { position: relative; }
  input { width: 100%; font: inherit; padding: 13px 14px; border: 2px solid #cfd3e4; border-radius: 12px; background: #fff; }
  input:focus { border-color: var(--cobalt); outline: none; }
  input.bad { border-color: var(--error); }
  input.good { border-color: var(--ok); }
  .toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; font: inherit; font-size: .85rem; font-weight: 700; color: var(--cobalt); cursor: pointer; padding: 6px 8px; }
  .err { color: var(--error); font-weight: 500; font-size: .85rem; min-height: 1.2em; }
  .hint { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .bar { height: 6px; border-radius: 6px; background: #dfe2ee; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--error); transition: width .2s, background .2s; }
  button.send { font: inherit; font-weight: 700; padding: 14px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; cursor: pointer; margin-top: 4px; }
  button.send:hover { background: var(--cobalt); }
  #status { font-weight: 700; color: var(--ok); text-align: center; min-height: 1.4em; }
  .back { display: block; text-align: center; margin-top: 18px; color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>

<div class="box">
  <h1>Ro'yxatdan o'tish</h1>
  <p class="sub">Hisob yaratish uchun ma'lumotlaringizni kiriting.</p>

  <form id="form" novalidate>
    <label>Email
      <input type="email" id="email" name="email" autocomplete="email" placeholder="ism@pochta.uz" required>
      <span class="err" id="e-email"></span>
    </label>

    <label>Telefon raqam
      <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="+998 90 123 45 67" required>
      <span class="err" id="e-phone"></span>
    </label>

    <label>Parol
      <div class="field">
        <input type="password" id="pass" name="password" autocomplete="new-password" placeholder="Kamida 8 ta belgi" required>
        <button type="button" class="toggle" id="toggle" aria-label="Parolni ko'rsatish">Ko'rsatish</button>
      </div>
      <div class="bar" aria-hidden="true"><span id="strength"></span></div>
      <span class="hint">Kamida 8 ta belgi, harf va raqam bo'lsin.</span>
      <span class="err" id="e-pass"></span>
    </label>

    <label>Parolni takrorlang
      <input type="password" id="pass2" autocomplete="new-password" required>
      <span class="err" id="e-pass2"></span>
    </label>

    <button class="send" type="submit">Hisob yaratish</button>
    <div id="status" role="status"></div>
  </form>

  <a class="back" href="index.html">Bosh sahifaga qaytish</a>
</div>

<script>
  const $ = id => document.getElementById(id);
  const email = $('email'), phone = $('phone'), pass = $('pass'), pass2 = $('pass2');

  // Telefon raqamni +998 XX XXX XX XX ko'rinishida yozib beradi
  phone.addEventListener('input', () => {
    let d = phone.value.replace(/\D/g, '');
    if (!d.startsWith('998')) d = '998' + d;
    d = d.slice(0, 12);
    const p = [d.slice(0,3), d.slice(3,5), d.slice(5,8), d.slice(8,10), d.slice(10,12)].filter(Boolean);
    phone.value = '+' + p.join(' ');
  });

  // Parolni ko'rsatish / yashirish
  $('toggle').addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = pass2.type = show ? 'text' : 'password';
    $('toggle').textContent = show ? 'Yashirish' : "Ko'rsatish";
  });

  // Parol kuchi
  pass.addEventListener('input', () => {
    const v = pass.value;
    let s = 0;
    if (v.length >= 8) s++;
    if (/[A-Za-z]/.test(v) && /\d/.test(v)) s++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
    const bar = $('strength');
    bar.style.width = (s * 25) + '%';
    bar.style.background = s <= 1 ? '#c62828' : s <= 2 ? '#f0a020' : '#1f8f5f';
  });

  function mark(input, errId, msg) {
    $(errId).textContent = msg;
    input.classList.toggle('bad', !!msg);
    input.classList.toggle('good', !msg);
    return !msg;
  }

  function validate() {
    const okEmail = mark(email, 'e-email',
      /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim()) ? '' : "Email noto'g'ri yozilgan.");
    const okPhone = mark(phone, 'e-phone',
      /^\+998 \d{2} \d{3} \d{2} \d{2}$/.test(phone.value) ? '' : "Raqamni to'liq kiriting: +998 XX XXX XX XX");
    const okPass = mark(pass, 'e-pass',
      pass.value.length >= 8 && /[A-Za-z]/.test(pass.value) && /\d/.test(pass.value)
        ? '' : "Parol kamida 8 ta belgi, harf va raqamdan iborat bo'lsin.");
    const okPass2 = mark(pass2, 'e-pass2',
      pass2.value && pass2.value === pass.value ? '' : "Parollar bir xil emas.");
    return okEmail && okPhone && okPass && okPass2;
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    $('status').textContent = '';
    if (!validate()) return;

    // Shu yerda ma'lumotni o'z serveringizga yuborasiz:
    // fetch('/api/register', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ email: email.value.trim(), phone: phone.value, password: pass.value })
    // });

    $('status').textContent = "Tayyor! Hisobingiz yaratildi.";
    try { sessionStorage.setItem('edunova_user', email.value.trim()); } catch (err) {}
    setTimeout(() => { window.location.href = "platform.html"; }, 900);
    e.target.reset();
    document.querySelectorAll('input').forEach(i => i.classList.remove('good', 'bad'));
    $('strength').style.width = '0';
  });
</script>
</body>
</html>
